      <stop offset="100%" stopColor="#8C611D" />
    </linearGradient>
    <linearGradient id="favInnerLeft" x1="30" y1="22" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#EED28B" />
