  <path d="M 50 78 C 68 76 90 68 94 48 C 84 46 68 58 50 78 Z" fill="url(#favOuterRight)" />

  <!-- Mid Petals -->
  <path d="M 50 79 C 32 75 14 54 18 32 C 28 38 42 58 50 79 Z" fill="url(#favMidLeft)" />
  <path d="M 50 79 C 68 75 86 54 82 32 C 72 38 58 58 50 79 Z" fill="url(#favMidRight)" />

  <!-- Inner Petals -->
  <path d="M 50 80 C 38 72 26 48 31 20 C 41 28 47 54 50 80 Z" fill="url(#favInnerLeft)" />
  <path d="M 50 80 C 62 72 74 48 69 20 C 59 28 53 54 50 80 Z" fill="url(#favInnerRight)" />

  <!-- Crown Petal -->
  <path d="M 50 8 C 41 24 40 56 50 81 C 60 56 59 24 50 8 Z" fill="url(#favCenterGrad)" />
  <path d="M 50 10 Q 50 46 50 76" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- Pericarp Center -->
